# docker-compose up --build -d
# docker-compose up --build -d backend

# ubuntu
# docker compose build backend worker --no-cache
# docker compose up -d backend worker

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airag-backend
    # 記憶體上限與重啟策略必須成套：只設上限而不會自動重啟，等於把「主機假死」
    # 換成「容器被 OOM-kill 後靜默不起」。backend 掛掉是全體使用者的 API 中斷，
    # 比 worker 的單一任務失敗嚴重，因此值不低於 worker
    mem_limit: 8g
    restart: unless-stopped
    ports:
      - "53020:53020"
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URL=mongodb://airag_admin:${MONGO_ADMIN_PASSWORD}@mongodb:27017/?authSource=admin
      - QDRANT_HOST=qdrant
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - REDIS_HOST=redis
      - HF_HUB_DISABLE_TELEMETRY=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - qdrant
      - redis
    networks:
      - airag-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airag-worker
    command: ["arq", "worker.WorkerSettings"]
    # 圖片描述階段會同時持有整份 PDF 的圖片 bytes 與 base64 副本，撐爆時要讓核心
    # OOM-kill 容器內的行程（單一 ingest 任務失敗），而不是拖垮整台主機
    mem_limit: 8g
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URL=mongodb://airag_admin:${MONGO_ADMIN_PASSWORD}@mongodb:27017/?authSource=admin
      - QDRANT_HOST=qdrant
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - REDIS_HOST=redis
      - HF_HUB_DISABLE_TELEMETRY=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - qdrant
      - redis
    networks:
      - airag-network

  redis:
    image: redis:7-alpine
    container_name: airag-redis
    ports:
      - "6379:6379"
    networks:
      - airag-network

  mongodb:
    image: mongo:7
    container_name: airag-mongodb
    # 27017 有 publish 到宿主機（KB 在另一台主機需連入），少了 --auth 等於內網任何機器
    # 都能無憑證讀寫全部資料。注意帳號必須先在無認證狀態下建好再開此旗標，順序顛倒會得到
    # 「有認證但無任何帳號」的鎖死狀態；重建 mongo_data volume 時同理。
    # 見 docs/DevelopmentProcess/NewFeaturesPlan_MongoDBAuthPlan.md
    command: ["--auth"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=airag
    networks:
      - airag-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: airag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - airag-network

  frontend:
    image: nginx:alpine
    container_name: airag-frontend
    ports:
      - "53010:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - airag-network

volumes:
  mongo_data:
  qdrant_data:

networks:
  airag-network:
    name: airag-network
    driver: bridge
