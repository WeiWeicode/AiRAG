# docker-compose up --build -d
# docker-compose up --build -d backend

# ubuntu
# docker compose build backend worker --no-cache
# docker compose up -d backend worker

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airag-backend
    ports:
      - "53020:53020"
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - QDRANT_HOST=qdrant
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - REDIS_HOST=redis
      - HF_HUB_DISABLE_TELEMETRY=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - qdrant
      - redis
    networks:
      - airag-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airag-worker
    command: ["arq", "worker.WorkerSettings"]
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - QDRANT_HOST=qdrant
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - REDIS_HOST=redis
      - HF_HUB_DISABLE_TELEMETRY=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - qdrant
      - redis
    networks:
      - airag-network

  redis:
    image: redis:7-alpine
    container_name: airag-redis
    ports:
      - "6379:6379"
    networks:
      - airag-network

  mongodb:
    image: mongo:7
    container_name: airag-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=airag
    networks:
      - airag-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: airag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - airag-network

  frontend:
    image: nginx:alpine
    container_name: airag-frontend
    ports:
      - "53010:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - airag-network

volumes:
  mongo_data:
  qdrant_data:

networks:
  airag-network:
    name: airag-network
    driver: bridge
